# Nginx Proxy Manager: JinGo Proxy Host > Advanced. See docs/SEPAY-SECURITY.md first.
# Verified against https://developer.sepay.vn/vi/dia-chi-ip on 2026-10-30.
# Replace upstream IP:port if your JinGo server changes. Restricts ONLY these two paths.

# Case-insensitive and trailing-slash variants are restricted too (Express routing compatibility).
location ~* ^/api/v1/payments/sepay/(?:oauth/token|webhook)/*$ {
    if ($scheme != https) { return 403; }
    # Use original socket peer, BEFORE any global real_ip_header rewrite.
    # This host must receive SePay directly through destination NAT (not an upstream CDN).
    if ($realip_remote_addr !~* "^(?:(?:::ffff:)?(?:172\.236\.138\.20|172\.233\.83\.68|171\.244\.35\.2|151\.158\.108\.68|151\.158\.109\.79|103\.255\.238\.139|45\.57\.137\.67)|2400:8905::2000:8cff:fe98:45cd|2600:3c15::2000:8aff:fedd:874b)$") { return 403; }
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-For $realip_remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_pass http://172.16.150.171:3100;
}
