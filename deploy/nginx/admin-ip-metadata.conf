# Legacy admin-only alternative. Prefer client-ip.conf for both public limits and admin IP metadata.
# Optional: NPM > jingo.io.vn > Advanced, alongside the separate SePay location.
# Replace CHANGE_ME_WITH_64_RANDOM_HEX with the SAME ADMIN_PROXY_SECRET in JinGo .env.
# Generate locally: openssl rand -hex 32. Never reuse SePay/SMTP credentials.
# Applies only to admin APIs. Requires direct NPM ingress / destination NAT;
# if another proxy or source NAT precedes NPM, the original peer may be that proxy.
location ~* ^/api/v1/admin(?:/|$) {
    proxy_set_header X-Jingo-Edge-Secret "CHANGE_ME_WITH_64_RANDOM_HEX";
    proxy_set_header X-Jingo-Client-IP $realip_remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-For $realip_remote_addr;
    proxy_http_version 1.1;
    client_max_body_size 12m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_pass http://172.16.150.171:3100;
}
