# JinGo Proxy Host > Advanced. Keep the EXISTING SePay whitelist location unchanged.
# Replace the placeholder with the SAME ADMIN_PROXY_SECRET in JinGo .env.
# Generate: openssl rand -hex 32. Keep this value private; never use gateway secrets.
# This prefix covers all normal API routes, including admin login IP metadata.
# Do NOT change this to "location ^~ /api/": that would skip SePay's regex whitelist.
# If an /api/ custom location already exists, merge/replace it instead of duplicating.
location /api/ {
    proxy_set_header X-Jingo-Edge-Secret "CHANGE_ME_WITH_64_RANDOM_HEX";
    proxy_set_header X-Jingo-Client-IP $realip_remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $realip_remote_addr;
    proxy_set_header X-Forwarded-For $realip_remote_addr;
    proxy_http_version 1.1;
    client_max_body_size 12m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_pass http://172.16.150.171:3100;
}
