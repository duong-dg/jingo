name: jingo
x-app: &app
  build: .
  image: jingo-app:local
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *app
    command: [npm, run, start, -w, '@jingo/web']
    environment:
      INTERNAL_API_URL: http://api:4000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      SEO_INDEXING: ${SEO_INDEXING:-false}
    ports: ['127.0.0.1:3100:3000']
    mem_limit: 768m
    depends_on:
      api: { condition: service_healthy }
  api:
    <<: *app
    command: [npm, run, start, -w, '@jingo/api']
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-jingo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jingo}
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      MEDIA_DIR: /app/data/media
    volumes: [media_data:/app/data/media]
    mem_limit: 512m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    command: [npm, run, start, -w, '@jingo/worker']
    environment:
      REDIS_URL: redis://redis:6379
    mem_limit: 256m
    depends_on:
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jingo}
      POSTGRES_USER: ${POSTGRES_USER:-jingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    mem_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  media_data:
  postgres_data:
  redis_data:
